name: Build Stardew Valley iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      include_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      use_interpreter:
        description: 'Override Mono UseInterpreter (empty=default, false=AOT-only crash-test IPA)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios --skip-manifest-update

      - name: Patch MonoGame Framework
        run: |
          dotnet run --project tools/PatchMonoGame

      - name: Restore NuGet Packages
        run: |
          dotnet restore src/SDViOS/SDViOS.csproj -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false

      - name: Build and Publish iOS App
        env:
          # workflow_dispatch only: 'false' builds an AOT-only variant (no interpreter).
          # Expected on device: ExecutionEngineException "Attempting to JIT compile method
          # ... while running in aot-only mode" at the first runtime-loaded game method —
          # that crash point is exactly what the StikDebug experiment needs to see.
          USE_INTERPRETER: ${{ inputs.use_interpreter }}
        run: |
          PUBLISH_ARGS=(
            -f net8.0-ios17.0
            -c Release
            -p:Platform=iPhone
            -p:RuntimeIdentifier=ios-arm64
            -p:ArchiveOnBuild=false
            -p:EnableCodeSigning=false
            -p:CodesignKey=""
            -p:CodesignProvision=""
            -p:CheckEolWorkloads=false
            -p:CheckEolTargetFramework=false
          )
          if [ -n "$USE_INTERPRETER" ]; then
            case "$USE_INTERPRETER" in
              true|false) PUBLISH_ARGS+=("-p:UseInterpreter=$USE_INTERPRETER") ;;
              *) echo "::error::use_interpreter must be 'true' or 'false'"; exit 1 ;;
            esac
          fi
          dotnet publish src/SDViOS/SDViOS.csproj "${PUBLISH_ARGS[@]}" -o ./publish

      - name: Package IPA
        run: |
          if [ -f "./publish/SDViOS.ipa" ]; then
            echo "Found generated IPA: ./publish/SDViOS.ipa"
            cp ./publish/SDViOS.ipa ./StardewValley-iOS.ipa
          else
            echo "Packaging from .app bundle..."
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "Error: No .app or .ipa found!"
              exit 1
            fi
            echo "Found .app at: $APP_PATH"
            mkdir -p ipa_staging/Payload
            cp -R "$APP_PATH" ipa_staging/Payload/
            cd ipa_staging
            zip -r -q ../StardewValley-iOS.ipa Payload
            cd ..
          fi
          ls -lh StardewValley-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StardewValley-iOS${{ inputs.use_interpreter == 'true' && '-interpreter' || inputs.use_interpreter == 'false' && '-aot-only' || '' }}
          path: StardewValley-iOS.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ github.ref == 'refs/heads/main' || inputs.include_release || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: StardewValley-iOS.ipa
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: Stardew Valley iOS Port (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }})
          draft: false
          prerelease: false
          make_latest: true
